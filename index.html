<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bours'One</title>

<style>

/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    background: #000;
    color: white;
    overflow-x: hidden;
}


/* =========================================================
   FOND
========================================================= */

.game-screen {
    min-height: 100vh;
    padding: 20px 28px;
    position: relative;
    overflow: hidden;

    background:
        radial-gradient(circle at 50% 0%, rgba(0,255,210,.12), transparent 35%),
        linear-gradient(135deg, #00151f 0%, #002631 45%, #00131d 100%);
}


/* Faux graphique boursier en arrière-plan */

.game-screen::before {
    content: "";
    position: absolute;
    inset: 0;

    background-image:
        linear-gradient(rgba(0,255,220,.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,255,220,.08) 1px, transparent 1px);

    background-size: 70px 55px;
    opacity: .45;
    pointer-events: none;
}


/* =========================================================
   CONTENU
========================================================= */

.container {
    position: relative;
    z-index: 2;
    max-width: 1510px;
    margin: auto;
}


/* =========================================================
   HEADER
========================================================= */

.header {
    text-align: center;
    margin-bottom: 20px;
}

.logo {
    display: inline-block;

    padding: 8px 80px 12px;

    border-radius: 70px;

    background:
        linear-gradient(135deg, #0ce5c1, #00bfa5);

    box-shadow:
        0 0 25px rgba(0,255,210,.4),
        inset 0 0 25px rgba(255,255,255,.15);
}

.logo h1 {
    font-size: 62px;
    font-weight: 800;
    letter-spacing: -3px;
}

.logo p {
    font-size: 22px;
    margin-top: -5px;
    color: #dffff9;
}

.subtitle {
    margin-top: 20px;

    font-size: 27px;
    font-weight: 700;
    letter-spacing: .5px;
}


/* =========================================================
   BANDEAU
========================================================= */

.banner {
    height: 64px;

    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;

    margin: 30px 20px 20px;

    border: 2px solid #00e7ce;
    border-radius: 20px;

    background: rgba(0,60,72,.55);

    box-shadow:
        0 0 20px rgba(0,255,210,.12),
        inset 0 0 20px rgba(0,255,210,.04);

    font-size: 25px;
    font-weight: 800;
    color: #00e7ce;
}

.banner-icon {
    font-size: 34px;
}


/* =========================================================
   PANNEAUX
========================================================= */

.panels {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 22px;
}

.panel {
    border: 2px solid rgba(0,255,220,.25);
    border-radius: 24px;

    padding: 25px 22px 20px;

    background:
        linear-gradient(
            145deg,
            rgba(0,30,45,.90),
            rgba(0,20,31,.96)
        );

    box-shadow:
        inset 0 0 30px rgba(0,255,220,.025),
        0 10px 40px rgba(0,0,0,.25);
}


/* =========================================================
   TITRES
========================================================= */

.panel-title {
    display: flex;
    align-items: center;
    gap: 16px;

    margin-bottom: 22px;

    font-size: 25px;
    font-weight: 800;
}

.panel-title .icon {
    font-size: 37px;
}


/* =========================================================
   INPUT PSEUDO
========================================================= */

.pseudo-input {
    width: 100%;
    height: 80px;

    padding: 0 20px;

    border-radius: 20px;
    border: 2px solid #1e5d83;

    background:
        linear-gradient(
            135deg,
            rgba(19,57,85,.8),
            rgba(7,32,53,.9)
        );

    color: white;

    font-size: 24px;

    outline: none;

    transition: .25s;
}

.pseudo-input::placeholder {
    color: #9eb9d2;
}

.pseudo-input:focus {
    border-color: #00e7ce;

    box-shadow:
        0 0 20px rgba(0,255,220,.18);
}


/* =========================================================
   BOUTONS SALON
========================================================= */

.room-buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;

    margin-top: 40px;
}

.btn {
    height: 86px;

    border-radius: 20px;

    border: 2px solid rgba(0,255,220,.45);

    background: rgba(0,55,65,.65);

    color: #00e7ce;

    font-size: 25px;
    font-weight: 800;

    cursor: pointer;

    transition:
        transform .15s ease,
        background .2s ease,
        box-shadow .2s ease;
}

.btn:hover {
    transform: translateY(-2px);

    background: rgba(0,130,125,.5);

    box-shadow:
        0 0 20px rgba(0,255,210,.2);
}

.btn:active {
    transform: scale(.98);
}


/* Bouton créer */

.btn-create {
    color: white;

    background:
        linear-gradient(
            135deg,
            #0de1bb,
            #00b99d
        );

    border-color: #00e8cc;

    box-shadow:
        0 8px 25px rgba(0,255,210,.18);
}

.btn-create:hover {
    background:
        linear-gradient(
            135deg,
            #16f1ca,
            #00cbaa
        );
}


/* =========================================================
   CAPITAL
========================================================= */

.capital-line {
    display: flex;
    align-items: center;
    justify-content: space-between;

    font-size: 21px;
    font-weight: 700;

    margin-bottom: 10px;
}

.capital-value {
    color: #00e7ce;
    font-size: 26px;
}


/* =========================================================
   SLIDER
========================================================= */

.slider-container {
    position: relative;
    margin: 10px 0 25px;
}

.capital-slider {
    width: 100%;

    height: 15px;

    appearance: none;

    border-radius: 20px;

    background:
        linear-gradient(
            90deg,
            #00e7ce 0%,
            #00e7ce 20%,
            #d9e0e5 20%,
            #d9e0e5 100%
        );

    outline: none;

    cursor: pointer;
}


/* curseur */

.capital-slider::-webkit-slider-thumb {
    appearance: none;

    width: 36px;
    height: 36px;

    border-radius: 50%;

    background: white;

    border: 1px solid #ddd;

    box-shadow: 0 2px 8px rgba(0,0,0,.4);

    cursor: pointer;
}

.capital-slider::-moz-range-thumb {
    width: 36px;
    height: 36px;

    border-radius: 50%;

    background: white;

    border: 1px solid #ddd;

    cursor: pointer;
}

.slider-labels {
    display: flex;
    justify-content: space-between;

    margin-top: 8px;

    font-size: 16px;
    color: #dce7ed;
}


/* =========================================================
   IA
========================================================= */

.ia-title {
    font-size: 20px;
    font-weight: 700;

    margin: 12px 0;
}

.ia-buttons {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
}

.ia-btn {
    height: 60px;

    border-radius: 18px;

    border: 2px solid rgba(0,255,220,.35);

    background: rgba(0,70,72,.5);

    color: white;

    font-size: 20px;
    font-weight: 800;

    cursor: pointer;

    transition: .2s;
}

.ia-btn:hover {
    background: rgba(0,150,135,.5);
}

.ia-btn.active {
    background:
        linear-gradient(
            135deg,
            #16e7bd,
            #00bca2
        );

    color: white;

    border-color: #00f2d2;

    box-shadow:
        0 0 20px rgba(0,255,210,.25);
}


/* =========================================================
   LANCER
========================================================= */

.launch {
    width: 100%;

    height: 72px;

    margin-top: 17px;

    border: none;

    border-radius: 20px;

    background:
        linear-gradient(
            135deg,
            #13dfbb,
            #00bda0
        );

    color: white;

    font-size: 25px;
    font-weight: 800;

    cursor: pointer;

    box-shadow:
        0 8px 25px rgba(0,255,210,.15);

    transition: .2s;
}

.launch:hover {
    transform: translateY(-2px);

    box-shadow:
        0 12px 35px rgba(0,255,210,.28);
}

.launch:active {
    transform: scale(.98);
}


/* =========================================================
   MODALE
========================================================= */

.modal {
    position: fixed;

    inset: 0;

    display: none;
    align-items: center;
    justify-content: center;

    background: rgba(0,0,0,.75);

    z-index: 100;
}

.modal.show {
    display: flex;
}

.modal-box {
    width: min(500px, 90%);

    padding: 30px;

    border-radius: 25px;

    background:
        linear-gradient(
            145deg,
            #032d3b,
            #011923
        );

    border: 2px solid #00e7ce;

    box-shadow:
        0 0 50px rgba(0,255,210,.2);

    text-align: center;
}

.modal-box h2 {
    margin-bottom: 20px;

    font-size: 28px;
}

.modal-box input {
    width: 100%;

    height: 60px;

    padding: 0 15px;

    border-radius: 15px;

    border: 2px solid #1e5d83;

    background: #08263a;

    color: white;

    font-size: 20px;

    outline: none;

    margin-bottom: 15px;
}

.modal-box button {
    width: 100%;

    height: 60px;

    border: none;

    border-radius: 15px;

    background: #00d8b7;

    color: white;

    font-size: 20px;

    font-weight: 800;

    cursor: pointer;
}

.close-modal {
    margin-top: 10px;

    background: transparent !important;

    color: #91b6c8 !important;
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media (max-width: 900px) {

    .panels {
        grid-template-columns: 1fr;
    }

    .logo {
        padding: 8px 35px 12px;
    }

    .logo h1 {
        font-size: 42px;
    }

    .logo p {
        font-size: 17px;
    }

    .subtitle {
        font-size: 19px;
    }

    .banner {
        font-size: 18px;
    }
}

@media (max-width: 600px) {

    .game-screen {
        padding: 12px;
    }

    .room-buttons {
        grid-template-columns: 1fr;
    }

    .panel {
        padding: 18px;
    }

    .panel-title {
        font-size: 20px;
    }

    .capital-line {
        font-size: 17px;
    }

    .capital-value {
        font-size: 21px;
    }
}

</style>
</head>


<body>


<div class="game-screen">

<div class="container">


<!-- =====================================================
     HEADER
===================================================== -->

<header class="header">

    <div class="logo">
        <h1>Bours'One</h1>
        <p>créé par Erwan Troadec</p>
    </div>

    <div class="subtitle">
        LE JEU DE STRATÉGIE FINANCIÈRE &amp; BOURSIÈRE
    </div>

</header>


<!-- =====================================================
     BANDEAU
===================================================== -->

<div class="banner">

    <span class="banner-icon">🛡</span>

    <span>APPRENEZ LA BOURSE EN JOUANT</span>

</div>


<!-- =====================================================
     PANNEAUX
===================================================== -->

<div class="panels">


<!-- =====================================================
     GAUCHE
===================================================== -->

<section class="panel">

    <div class="panel-title">

        <span class="icon">👤</span>

        <span>VOTRE PSEUDO DE TRADER</span>

    </div>


    <input
        id="pseudo"
        class="pseudo-input"
        type="text"
        maxlength="20"
        placeholder="Entrez votre pseudo..."
    >


    <div class="room-buttons">

        <button
            id="createRoom"
            class="btn btn-create"
        >
            🏠 &nbsp; Créer Salon
            <small>(1 – 4 J.)</small>
        </button>


        <button
            id="joinRoom"
            class="btn"
        >
            🚪 &nbsp; Rejoindre Salon
        </button>

    </div>

</section>



<!-- =====================================================
     DROITE
===================================================== -->

<section class="panel">

    <div class="panel-title">

        <span class="icon">⚙️</span>

        <span>PARAMÈTRES DE PARTIE</span>

    </div>


    <!-- CAPITAL -->

    <div class="capital-line">

        <span>Objectif Capital :</span>

        <span
            id="capitalValue"
            class="capital-value"
        >
            250 000 €
        </span>

    </div>


    <div class="slider-container">

        <input
            id="capitalSlider"
            class="capital-slider"
            type="range"
            min="50000"
            max="1000000"
            step="10000"
            value="250000"
        >

        <div class="slider-labels">

            <span>50 000 €</span>

            <span>1 000 000 €</span>

        </div>

    </div>


    <!-- IA -->

    <div class="ia-title">
        🤖 &nbsp; Adversaires IA (Mode Solo)
    </div>


    <div class="ia-buttons">

        <button class="ia-btn" data-ia="1">
            1 IA
        </button>

        <button class="ia-btn" data-ia="2">
            2 IA
        </button>

        <button class="ia-btn active" data-ia="3">
            3 IA
        </button>

    </div>


    <!-- LANCER -->

    <button
        id="launchGame"
        class="launch"
    >
        ▶ &nbsp; Lancer la Partie Solo
    </button>

</section>

</div>

</div>
</div>



<!-- =====================================================
     MODALE CRÉER SALON
===================================================== -->

<div
    id="createModal"
    class="modal"
>

    <div class="modal-box">

        <h2>🏠 Créer un salon</h2>

        <input
            id="roomName"
            type="text"
            placeholder="Nom du salon..."
        >

        <button id="confirmCreate">
            Créer le salon
        </button>

        <button
            class="close-modal"
            id="closeCreate"
        >
            Annuler
        </button>

    </div>

</div>



<!-- =====================================================
     MODALE REJOINDRE
===================================================== -->

<div
    id="joinModal"
    class="modal"
>

    <div class="modal-box">

        <h2>🚪 Rejoindre un salon</h2>

        <input
            id="roomCode"
            type="text"
            placeholder="Code du salon..."
        >

        <button id="confirmJoin">
            Rejoindre
        </button>

        <button
            class="close-modal"
            id="closeJoin"
        >
            Annuler
        </button>

    </div>

</div>



<script>

/* =========================================================
   VARIABLES
========================================================= */

let selectedIA = 3;

let capital = 250000;


/* =========================================================
   PSEUDO
========================================================= */

const pseudoInput = document.getElementById("pseudo");

pseudoInput.addEventListener("input", () => {

    localStorage.setItem(
        "boursOnePseudo",
        pseudoInput.value
    );

});


/* Restaurer le pseudo */

const savedPseudo =
    localStorage.getItem("boursOnePseudo");

if (savedPseudo) {
    pseudoInput.value = savedPseudo;
}


/* =========================================================
   SLIDER CAPITAL
========================================================= */

const slider =
    document.getElementById("capitalSlider");

const capitalValue =
    document.getElementById("capitalValue");


function formatMoney(value) {

    return new Intl.NumberFormat(
        "fr-FR"
    ).format(value) + " €";

}


function updateSlider() {

    capital = Number(slider.value);

    capitalValue.textContent =
        formatMoney(capital);


    /* Mise à jour visuelle du slider */

    const min = Number(slider.min);
    const max = Number(slider.max);

    const percentage =
        ((capital - min) / (max - min)) * 100;

    slider.style.background =
        `linear-gradient(
            90deg,
            #00e7ce 0%,
            #00e7ce ${percentage}%,
            #d9e0e5 ${percentage}%,
            #d9e0e5 100%
        )`;

}


slider.addEventListener(
    "input",
    updateSlider
);

updateSlider();


/* =========================================================
   NOMBRE D'IA
========================================================= */

const iaButtons =
    document.querySelectorAll(".ia-btn");


iaButtons.forEach(button => {

    button.addEventListener("click", () => {

        iaButtons.forEach(btn => {
            btn.classList.remove("active");
        });

        button.classList.add("active");

        selectedIA =
            Number(button.dataset.ia);

    });

});


/* =========================================================
   MODALES
========================================================= */

const createModal =
    document.getElementById("createModal");

const joinModal =
    document.getElementById("joinModal");


/* Créer */

document
    .getElementById("createRoom")
    .addEventListener("click", () => {

        createModal.classList.add("show");

    });


/* Rejoindre */

document
    .getElementById("joinRoom")
    .addEventListener("click", () => {

        joinModal.classList.add("show");

    });


/* Fermer */

document
    .getElementById("closeCreate")
    .addEventListener("click", () => {

        createModal.classList.remove("show");

    });


document
    .getElementById("closeJoin")
    .addEventListener("click", () => {

        joinModal.classList.remove("show");

    });


/* =========================================================
   CRÉATION SALON
========================================================= */

document
    .getElementById("confirmCreate")
    .addEventListener("click", () => {

        const pseudo =
            pseudoInput.value.trim();

        const roomName =
            document
            .getElementById("roomName")
            .value.trim();


        if (!pseudo) {

            alert(
                "Veuillez entrer votre pseudo de trader."
            );

            createModal.classList.remove("show");

            pseudoInput.focus();

            return;
        }


        if (!roomName) {

            alert(
                "Veuillez entrer un nom de salon."
            );

            return;
        }


        /* Ici tu pourras connecter ton système multijoueur */

        alert(
            `Salon "${roomName}" créé !\n\nTrader : ${pseudo}`
        );

        createModal.classList.remove("show");

    });



/* =========================================================
   REJOINDRE SALON
========================================================= */

document
    .getElementById("confirmJoin")
    .addEventListener("click", () => {

        const pseudo =
            pseudoInput.value.trim();

        const code =
            document
            .getElementById("roomCode")
            .value.trim();


        if (!pseudo) {

            alert(
                "Veuillez entrer votre pseudo de trader."
            );

            joinModal.classList.remove("show");

            pseudoInput.focus();

            return;
        }


        if (!code) {

            alert(
                "Veuillez entrer le code du salon."
            );

            return;
        }


        alert(
            `Connexion au salon ${code}...\n\nTrader : ${pseudo}`
        );

        joinModal.classList.remove("show");

    });



/* =========================================================
   LANCER PARTIE SOLO
========================================================= */

document
    .getElementById("launchGame")
    .addEventListener("click", () => {

        const pseudo =
            pseudoInput.value.trim();


        if (!pseudo) {

            alert(
                "Entrez d'abord votre pseudo de trader."
            );

            pseudoInput.focus();

            return;
        }


        /* Configuration de la partie */

        const gameSettings = {

            pseudo: pseudo,

            capital: capital,

            ia: selectedIA

        };


        /*
         * Sauvegarde de la configuration.
         *
         * Ton vrai jeu pourra récupérer ces données
         * dans la page suivante.
         */

        localStorage.setItem(
            "boursOneGameSettings",
            JSON.stringify(gameSettings)
        );


        console.log(
            "Partie lancée :",
            gameSettings
        );


        /*
         * SI TON JEU EST DANS game.html :
         * décommente la ligne suivante :
         *
         * window.location.href = "game.html";
         */


        alert(
            `PARTIE SOLO\n\n` +
            `Trader : ${pseudo}\n` +
            `Capital objectif : ${formatMoney(capital)}\n` +
            `Adversaires IA : ${selectedIA}`
        );

    });


/* =========================================================
   FERMER MODALES EN CLIQUANT À L'EXTÉRIEUR
========================================================= */

window.addEventListener("click", (event) => {

    if (event.target === createModal) {
        createModal.classList.remove("show");
    }

    if (event.target === joinModal) {
        joinModal.classList.remove("show");
    }

});

</script>

</body>
</html>
